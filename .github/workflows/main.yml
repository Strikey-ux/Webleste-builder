
name: Build Webleste

on:
  workflow_dispatch:
  push:
    branches:
      - threads-v2

permissions:
  contents: read

jobs:
  build:
    name: Build Webleste
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            8.0.x

      - name: Install Mono
        run: sudo apt-get install mono-devel

      - name: Build Webleste
        run: |
          cd loader && dotnet workload restore && cd ..
          make publish

      - name: Upload built website
        uses: actions/upload-artifact@v4
        with:
          name: webleste
          path: frontend/dist/
          compression-level: 6
